name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  installed-package:
    name: Installed package (Nest 11 / TypeORM 0.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:package

  schema:
    name: Access and schema (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: escalated_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ESCALATED_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/escalated_test

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Synchronize the schema on PostgreSQL
        run: npx jest --runInBand test/entities/schema-portability.spec.ts test/entities/ticket-access-migration.spec.ts test/entities/sla-warning-flags-migration.spec.ts test/entities/verified-guest-access-migration.spec.ts test/integration/ticket-access.spec.ts test/integration/reporting-databases.spec.ts

  access-mysql:
    name: Access and migration (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: escalated_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      ESCALATED_TEST_MYSQL_URL: mysql://root:mysql@localhost:3306/escalated_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx jest --runInBand test/entities/ticket-access-migration.spec.ts test/entities/sla-warning-flags-migration.spec.ts test/entities/verified-guest-access-migration.spec.ts test/integration/ticket-access.spec.ts test/integration/reporting-databases.spec.ts
